<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mindu Guide</title>
  <link rel="stylesheet" href="guide/gmc-guide.css" />
  <link rel="stylesheet" href="kiosk/kiosk.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      box-sizing: border-box;
      background: #faf7f0;
    }
    @media (prefers-color-scheme: dark) { body { background: #12172a; } }
  </style>
</head>
<body>
  <div id="intro" hidden></div>
  <main id="guide" hidden></main>
  <button type="button" class="ks-restart" hidden>↺ Start over</button>
  <button type="button" class="ks-map" aria-label="Open the Experience Centre map" title="Experience Centre map" hidden></button>
  <script src="guide/gmc-guide.js"></script>
  <script src="kiosk/kiosk.js"></script>
  <script>
    // UI and API share the same origin.
    async function api(path, init) {
      const res = await fetch(path, init);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(data.error || `HTTP ${res.status}`), { userMessage: data.error });
      return data;
    }

    function mountGuide(el, extra) {
      window.guide = MinduGuide.mount(el, {
        ...extra,
        answer: async (question, history) => {
          const data = await api('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, history, chamberId: 'reception', audience: 'general' }),
          });
          return { text: data.answer, sources: data.sources };
        },
        transcribe: async (blob) => {
          const data = await api('/api/transcribe', {
            method: 'POST',
            headers: { 'Content-Type': blob.type.split(';')[0] || 'audio/webm' },
            body: blob,
          });
          return data.text;
        },
        suggestions: ['What is GMC?', 'Who leads GMC?', 'What are the economic sectors?'],
      });

      // Show which brain is connected.
      const mode = document.createElement('p');
      mode.className = 'mg-mode';
      el.appendChild(mode);
      api('/api/health')
        .then((h) => { mode.textContent = h.mode === 'live-ai' ? 'Live GMC AI connected' : 'Demo mode — limited answers available'; })
        .catch(() => { mode.textContent = 'The guide is temporarily unavailable. Please try again shortly.'; });
      return window.guide;
    }

    // Kiosk flow: logo splash → QR / continue as guest → chat.
    MinduKiosk.start({
      intro: document.getElementById('intro'),
      guide: document.getElementById('guide'),
      restart: document.querySelector('.ks-restart'),
      mapButton: document.querySelector('.ks-map'),
      // Set a deployed venue-map URL here when a map is available.
      mapUrl: null,
      mountGuide,
    });
  </script>
</body>
</html>
